<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="인증 우선순위 해석 애니메이션. 여러 자격증명이 설정되어 있을 때 위에서부터 내려오며 가장 먼저 발견된 것이 선택됩니다. 구독 OAuth 는 가장 약합니다.">
  <style>
    :root{ --fg:#111; --sub:#555; --muted:#bdbdbd }
    text{ font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif }
    .t{ font-size:13.5px; font-weight:700 }
    .s{ font-size:10.5px; fill:var(--sub) }
    .rank{ font-size:15px; font-weight:800; fill:#fff }

    .row rect{ stroke-width:2 }
    /* 설정되지 않은 항목 = 흐림 */
    .off{ opacity:.28 }

    /* 스캐너가 위에서 아래로 훑다가 3순위에서 멈춤 */
    .scan{ fill:#e53935; opacity:.16; animation:scan 7s cubic-bezier(.5,0,.5,1) infinite }
    @keyframes scan{
      0%   { transform:translateY(0);    opacity:0 }
      6%   { transform:translateY(0);    opacity:.16 }
      22%  { transform:translateY(46px); opacity:.16 }
      38%  { transform:translateY(92px); opacity:.16 }
      52%  { transform:translateY(92px); opacity:.16 }
      86%  { transform:translateY(92px); opacity:.16 }
      100% { transform:translateY(92px); opacity:0 }
    }
    /* 3순위 당첨 강조 */
    .win{ animation:win 7s ease-in-out infinite }
    @keyframes win{
      0%,38%   { opacity:0; transform:scale(.94) }
      46%      { opacity:1; transform:scale(1) }
      88%      { opacity:1; transform:scale(1) }
      100%     { opacity:0; transform:scale(.94) }
    }
    /* 아래 순위들에 '가려짐' 표시 */
    .blocked{ animation:blocked 7s ease-in-out infinite }
    @keyframes blocked{
      0%,46%  { opacity:0 }
      56%     { opacity:1 }
      88%     { opacity:1 }
      100%    { opacity:0 }
    }
    @media (prefers-color-scheme: dark){
      :root{ --fg:#e8e8ea; --sub:#a8a8b3; --muted:#4a4a55 }
    }
    @media (prefers-reduced-motion: reduce){
      .scan,.win,.blocked{ animation:none }
      .win,.blocked{ opacity:1; transform:none }
      .scan{ opacity:.16; transform:translateY(92px) }
    }
  </style>

  <text class="t" x="24" y="26" fill="var(--fg)">여러 자격증명이 동시에 설정되어 있다면?</text>
  <text class="s" x="24" y="46">위에서부터 내려오며 가장 먼저 발견된 것이 이깁니다</text>

  <rect class="scan" x="18" y="60" width="500" height="42" rx="8"/>

  <!-- 0순위 -->
  <g class="row off">
    <rect x="24" y="62" width="488" height="38" rx="7" fill="#4a148c" stroke="#311b92"/>
    <text class="rank" x="44" y="86">0</text>
    <text class="t" x="70" y="80" fill="#fff">Gateway 세션</text>
    <text class="s" x="70" y="94" fill="#e1bee7">apps gateway 로그인 상태면 아래 전부보다 우선</text>
  </g>
  <!-- 1순위 -->
  <g class="row off">
    <rect x="24" y="108" width="488" height="38" rx="7" fill="#d32f2f" stroke="#b71c1c"/>
    <text class="rank" x="44" y="132">1</text>
    <text class="t" x="70" y="126" fill="#fff">Cloud 스위치</text>
    <text class="s" x="70" y="140" fill="#ffcdd2">CLAUDE_CODE_USE_BEDROCK / VERTEX / FOUNDRY</text>
  </g>
  <!-- 2순위 -->
  <g class="row off">
    <rect x="24" y="154" width="488" height="38" rx="7" fill="#f57c00" stroke="#e65100"/>
    <text class="rank" x="44" y="178">2</text>
    <text class="t" x="70" y="172" fill="#fff">ANTHROPIC_AUTH_TOKEN</text>
    <text class="s" x="70" y="186" fill="#ffe0b2">Bearer 헤더 · 게이트웨이 인증용</text>
  </g>
  <!-- 3순위 — 설정되어 있음 (당첨) -->
  <g class="row">
    <rect x="24" y="200" width="488" height="38" rx="7" fill="#fbc02d" stroke="#f9a825"/>
    <text class="rank" x="44" y="224" fill="#000">3</text>
    <text class="t" x="70" y="218" fill="#000">ANTHROPIC_API_KEY</text>
    <text class="s" x="70" y="232" fill="#5d4037">X-Api-Key 헤더 · ← .zshrc 에 남아 있던 그것</text>
  </g>
  <g class="win" style="transform-origin:600px 219px">
    <rect x="526" y="200" width="208" height="38" rx="7" fill="#2e7d32"/>
    <text class="t" x="630" y="224" text-anchor="middle" fill="#fff">✓ 이것이 선택됨</text>
  </g>

  <!-- 4~6순위 = 가려짐 -->
  <g class="row off">
    <rect x="24" y="246" width="488" height="34" rx="7" fill="#7cb342" stroke="#558b2f"/>
    <text class="rank" x="44" y="268">4</text>
    <text class="t" x="70" y="267" fill="#fff">apiKeyHelper</text>
  </g>
  <g class="row off">
    <rect x="24" y="288" width="488" height="34" rx="7" fill="#1976d2" stroke="#0d47a1"/>
    <text class="rank" x="44" y="310">5</text>
    <text class="t" x="70" y="309" fill="#fff">CLAUDE_CODE_OAUTH_TOKEN</text>
  </g>
  <g class="row off">
    <rect x="24" y="330" width="488" height="34" rx="7" fill="#673ab7" stroke="#4527a0"/>
    <text class="rank" x="44" y="352">6</text>
    <text class="t" x="70" y="351" fill="#fff">/login 구독 OAuth</text>
  </g>

  <g class="blocked">
    <text class="s" x="526" y="268" fill="#e53935">↑ 3순위에서 이미 결정되어</text>
    <text class="s" x="526" y="311" fill="#e53935">아래는 평가되지 않습니다</text>
    <text class="t" x="526" y="352" fill="#e53935">구독은 결제했지만</text>
    <text class="s" x="526" y="366" fill="#e53935">API 종량 요금이 나갑니다</text>
  </g>
</svg>
