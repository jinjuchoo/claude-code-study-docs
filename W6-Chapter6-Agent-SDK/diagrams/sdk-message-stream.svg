<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="query 호출 뒤 system, text, tool use, tool result, result 메시지가 순서대로 도착하는 흐름">
  <style>
    .bg{fill:#fff}.line{stroke:#607d8b;stroke-width:3}.card{fill:#e3f2fd;stroke:#1976d2;stroke-width:2}.result{fill:#e8f5e9;stroke:#388e3c;stroke-width:2}.t{font:16px sans-serif;fill:#111;stroke:none}.sub{font:13px sans-serif;fill:#37474f;stroke:none}.dot{fill:#ef6c00}.anim{animation:move 8s linear infinite}@keyframes move{0%,8%{transform:translate(86px,180px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(804px,180px);opacity:0}}@media (prefers-reduced-motion: reduce){.anim{display:none}.static{display:inline}}@media (prefers-color-scheme: dark){.bg{fill:#1b1f23}.t{fill:#f5f5f5}.sub{fill:#cfd8dc}}
  </style>
  <rect class="bg" width="900" height="250" rx="12"/>
  <text x="36" y="42" class="t">query()가 돌려주는 메시지 스트림</text>
  <line x1="105" y1="180" x2="805" y2="180" class="line"/>
  <text x="270" y="78" class="sub">↓ assistant 메시지 안의 블록</text>
  <text x="540" y="78" class="sub">↓ user 메시지 안의 블록</text>
  <g class="card"><rect x="55" y="90" width="110" height="55" rx="8"/><text x="80" y="122" class="t">system</text></g>
  <g class="card"><rect x="210" y="90" width="110" height="55" rx="8"/><text x="245" y="122" class="t">text</text></g>
  <g class="card"><rect x="365" y="90" width="120" height="55" rx="8"/><text x="383" y="122" class="t">tool_use</text></g>
  <g class="card"><rect x="530" y="90" width="135" height="55" rx="8"/><text x="545" y="122" class="t">tool_result</text></g>
  <g class="result"><rect x="710" y="90" width="130" height="55" rx="8"/><text x="746" y="122" class="t">result</text></g>
  <circle class="anim" cx="0" cy="0" r="9"/>
  <circle class="static" cx="805" cy="180" r="9"/>
  <text x="284" y="220" class="sub">문장은 assistant에서, 성공·비용·session ID는 마지막 result에서 읽는다.</text>
</svg>
