<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"
     role="img" aria-label="Foreground와 Background 실행 비교 애니메이션. 왼쪽은 Foreground로, 서브에이전트가 일하는 동안 메인 세션이 회전 스피너와 함께 완전히 멈춰 대기하다가, 서브에이전트가 끝나야 비로소 재개되는 모습. 오른쪽은 Background로, 서브에이전트가 같은 시간 동안 일하지만 메인 세션은 그동안 계속 입력을 받을 수 있고, 완료되면 하단 패널에 알림 배지만 추가되는 모습.">
  <style>
    .bg     { fill: #f5f6f8; }
    .card   { fill: #ffffff; stroke: #d5d9e0; stroke-width: 1.5; }
    .well   { fill: #e9ecf1; }
    .title  { font: 700 13px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: #1a1a2e; }
    .lbl    { font: 400 10px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: #667088; }
    .divide { stroke: #d5d9e0; stroke-width: 1; }
    .panel  { fill: #eef1f5; stroke: #d5d9e0; stroke-width: 1; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #12181f; }
      .card   { fill: #1b242e; stroke: #2a3542; }
      .well   { fill: #0c1117; }
      .title  { fill: #e2e4ec; }
      .lbl    { fill: #a6abbe; }
      .divide { stroke: #2a3542; }
      .panel  { fill: #161d26; stroke: #2a3542; }
    }

    /* 왼쪽: 메인이 완전히 멈춤 */
    .spinner { animation: spin 1.1s linear infinite; transform-origin: 105px 140px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fg-wait { animation: fgwait 4s ease-in-out infinite; }
    @keyframes fgwait { 0%, 68% { opacity: 1; } 78%, 100% { opacity: 0; } }

    .fg-resume { animation: fgresume 4s ease-in-out infinite; }
    @keyframes fgresume { 0%, 76% { opacity: 0; } 86%, 100% { opacity: 1; } }

    /* 오른쪽: 메인은 계속 입력 가능 — 커서 깜빡임 */
    .cursor { animation: cursor 1s step-end infinite; }
    @keyframes cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* 오른쪽: 완료 알림 배지 */
    .notify { animation: notify 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes notify {
      0%, 68%   { opacity: 0; transform: scale(0.6); }
      76%       { opacity: 1; transform: scale(1.15); }
      84%, 100% { opacity: 1; transform: scale(1); }
    }
    .panel-row-run { animation: rowrun 4s ease-in-out infinite; }
    @keyframes rowrun { 0%, 68% { opacity: 1; } 76%, 100% { opacity: 0; } }
    .panel-row-done { animation: rowdone 4s ease-in-out infinite; }
    @keyframes rowdone { 0%, 68% { opacity: 0; } 76%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .spinner, .fg-wait, .fg-resume, .cursor, .notify, .panel-row-run, .panel-row-done { animation: none; }
      .fg-wait { display: none; }
      .fg-resume { opacity: 1; }
      .cursor { opacity: 1; }
      .notify { opacity: 1; transform: scale(1); }
      .panel-row-run { display: none; }
      .panel-row-done { opacity: 1; }
      .anim { display: none; }
      .static { display: inline !important; }
    }
    .static { display: none; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="340" rx="12"/>
  <line class="divide" x1="380" y1="22" x2="380" y2="318" stroke-dasharray="6 3"/>

  <!-- ══════════ 왼쪽 · Foreground ══════════ -->
  <text class="title" x="190" y="44" text-anchor="middle">Foreground — 완료까지 대기</text>

  <!-- 메인 세션: 대기 중엔 스피너, 끝나면 재개 표시 -->
  <rect class="card" x="40" y="60" width="130" height="166" rx="8"/>
  <text class="lbl" x="105" y="78" text-anchor="middle">메인 세션</text>

  <g class="fg-wait">
    <circle cx="105" cy="140" r="22" fill="none" stroke="#d5d9e0" stroke-width="5"/>
    <path class="spinner" d="M105,118 A22,22 0 0 1 127,140" fill="none" stroke="#c2626c" stroke-width="5" stroke-linecap="round"/>
    <text class="lbl" x="105" y="178" text-anchor="middle" fill="#b3505c">대기 중 — 다른 입력 불가</text>
  </g>
  <g class="fg-resume">
    <circle cx="105" cy="140" r="22" fill="#5b8a6b" opacity="0.85"/>
    <path d="M95,140 L102,148 L118,130" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="lbl" x="105" y="178" text-anchor="middle" fill="#3f6b4f">재개 — 결과 도착</text>
  </g>

  <!-- 서브에이전트 (게이지: SMIL로 채워짐, 왼쪽 인스턴스) -->
  <rect class="card" x="190" y="60" width="130" height="166" rx="8"/>
  <text x="255" y="78" text-anchor="middle" fill="#c08a3e" style="font: 700 10px system-ui, sans-serif;">Subagent</text>
  <rect class="well" x="204" y="86" width="102" height="112" rx="4"/>
  <rect x="204" width="102" rx="4" class="anim">
    <animate attributeName="height" values="4;106;106;4"    keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="194;92;92;194"  keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill"   values="#7d93b4;#7d93b4;#5b8a6b;#7d93b4" keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect class="static" x="204" y="92" width="102" height="106" rx="4" fill="#5b8a6b"/>
  <text class="lbl" x="255" y="220" text-anchor="middle">진행률</text>

  <rect x="40" y="260" width="280" height="40" rx="6" fill="#c2626c" opacity="0.12"/>
  <text x="180" y="278" text-anchor="middle" fill="#b3505c" style="font: 700 10.5px system-ui, sans-serif;">다음 판단에 결과가 즉시 필요할 때</text>
  <text x="180" y="294" text-anchor="middle" fill="#b3505c" style="font: 400 9.5px system-ui, sans-serif;">헤드리스(-p)는 거의 항상 이 경로</text>

  <!-- ══════════ 오른쪽 · Background ══════════ -->
  <text class="title" x="570" y="44" text-anchor="middle">Background — 동시 진행</text>

  <!-- 메인 세션: 계속 살아있음 -->
  <rect class="card" x="400" y="60" width="130" height="166" rx="8"/>
  <text class="lbl" x="465" y="78" text-anchor="middle">메인 세션</text>
  <rect class="well" x="414" y="92" width="102" height="28" rx="4"/>
  <text x="422" y="110" fill="#3a4152" style="font: 400 10px ui-monospace, monospace;">다음 지시</text>
  <rect class="cursor" x="472" y="100" width="2" height="12" fill="#3a4152"/>
  <text class="lbl" x="465" y="178" text-anchor="middle" fill="#3f6b4f">계속 입력 가능</text>

  <!-- 서브에이전트 (게이지: SMIL로 채워짐, 오른쪽 인스턴스) -->
  <rect class="card" x="550" y="60" width="130" height="166" rx="8"/>
  <text x="615" y="78" text-anchor="middle" fill="#c08a3e" style="font: 700 10px system-ui, sans-serif;">Subagent</text>
  <rect class="well" x="564" y="86" width="102" height="112" rx="4"/>
  <rect x="564" width="102" rx="4" class="anim">
    <animate attributeName="height" values="4;106;106;4"    keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="194;92;92;194"  keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill"   values="#7d93b4;#7d93b4;#5b8a6b;#7d93b4" keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect class="static" x="564" y="92" width="102" height="106" rx="4" fill="#5b8a6b"/>
  <text class="lbl" x="615" y="220" text-anchor="middle">진행률</text>

  <!-- 하단 관리 패널 -->
  <rect class="panel" x="400" y="260" width="280" height="40" rx="6"/>
  <g class="panel-row-run">
    <circle cx="416" cy="280" r="4" fill="#c08a3e"/>
    <text class="lbl" x="428" y="284">code-reviewer 실행 중…</text>
  </g>
  <g class="panel-row-done">
    <circle cx="416" cy="280" r="4" fill="#5b8a6b"/>
    <text class="lbl" x="428" y="284">code-reviewer 완료</text>
  </g>
  <g class="notify">
    <circle cx="668" cy="270" r="8" fill="#5b8a6b"/>
    <text x="668" y="274" text-anchor="middle" fill="#ffffff" style="font: 700 10px system-ui, sans-serif;">1</text>
  </g>
</svg>
