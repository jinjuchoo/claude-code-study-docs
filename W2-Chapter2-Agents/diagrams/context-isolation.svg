<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"
     role="img" aria-label="컨텍스트 격리 비교 애니메이션. 왼쪽은 위임 없이 메인에서 직접 처리할 때 메인 컨텍스트 게이지가 파일과 로그로 가득 차오르며 붉어지고 응답 품질이 떨어지는 모습. 오른쪽은 서브에이전트에 위임했을 때 자식 컨텍스트가 대신 차오르고 메인에는 요약 한 조각만 돌아와 컨텍스트가 가볍게 유지되는 모습.">
  <style>
    .bg     { fill: #f5f6f8; }
    .card   { fill: #ffffff; stroke: #d5d9e0; stroke-width: 1.5; }
    .well   { fill: #e9ecf1; }
    .title  { font: 700 13px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: #1a1a2e; }
    .lbl    { font: 400 10px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: #667088; }
    .divide { stroke: #d5d9e0; stroke-width: 1; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #12181f; }
      .card   { fill: #1b242e; stroke: #2a3542; }
      .well   { fill: #0c1117; }
      .title  { fill: #e2e4ec; }
      .lbl    { fill: #a6abbe; }
      .divide { stroke: #2a3542; }
    }

    .flow { stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }

    .warn   { animation: warn 4s ease-in-out infinite; }
    @keyframes warn { 0%, 45% { opacity: 0; } 65%, 100% { opacity: 1; } }

    .parcel { animation: parcel 4s ease-in-out infinite; }
    @keyframes parcel {
      0%, 40%   { opacity: 0; transform: translateX(0); }
      55%       { opacity: 1; transform: translateX(0); }
      80%, 100% { opacity: 1; transform: translateX(-118px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow, .warn, .parcel { animation: none; }
      .warn { opacity: 1; }
      .parcel { opacity: 1; transform: translateX(-118px); }
      .anim { display: none; }
      .static { display: inline !important; }
    }
    .static { display: none; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b8a6b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="320" rx="12"/>
  <line class="divide" x1="380" y1="22" x2="380" y2="298" stroke-dasharray="6 3"/>

  <!-- ══════════ 왼쪽 · 위임 없이 ══════════ -->
  <text class="title" x="190" y="44" text-anchor="middle">위임 없이 — 메인에서 직접</text>

  <rect class="card" x="40" y="60" width="128" height="168" rx="8"/>
  <text class="lbl" x="104" y="78" text-anchor="middle">메인 컨텍스트</text>
  <rect class="well" x="54" y="86" width="100" height="130" rx="4"/>

  <!-- 게이지: 아래에서 위로 차오르며 붉어짐 -->
  <rect x="54" width="100" rx="4" class="anim">
    <animate attributeName="height" values="10;42;88;124;124" keyTimes="0;0.3;0.6;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="206;174;128;92;92"  keyTimes="0;0.3;0.6;0.85;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill"   values="#6f7d94;#8a8397;#b07d86;#c2626c;#c2626c" keyTimes="0;0.3;0.6;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect class="static" x="54" y="92" width="100" height="124" rx="4" fill="#c2626c"/>
  <text class="lbl" x="104" y="232" text-anchor="middle">컨텍스트 사용량</text>

  <text class="lbl" x="186" y="104">30개 파일 내용 축적</text>
  <text class="lbl" x="186" y="122">테스트 로그 수천 줄</text>
  <text class="lbl" x="186" y="140">Compaction 조기 도래</text>
  <text class="lbl" x="186" y="158">초기 지시 소실</text>

  <line class="flow" x1="182" y1="100" x2="158" y2="118" stroke="#c2626c" stroke-width="1.5"/>
  <line class="flow" x1="182" y1="118" x2="158" y2="130" stroke="#c98b78" stroke-width="1.5"/>
  <line class="flow" x1="182" y1="136" x2="158" y2="142" stroke="#c98b78" stroke-width="1.5"/>

  <g class="warn">
    <rect x="54" y="244" width="272" height="36" rx="6" fill="#c2626c" opacity="0.14"/>
    <text x="190" y="260" text-anchor="middle" fill="#b3505c" style="font: 700 10.5px system-ui, sans-serif;">응답 품질 저하</text>
    <text x="190" y="274" text-anchor="middle" fill="#b3505c" style="font: 400 9.5px system-ui, sans-serif;">긴 세션일수록 심해집니다</text>
  </g>

  <!-- ══════════ 오른쪽 · 위임하면 ══════════ -->
  <text class="title" x="570" y="44" text-anchor="middle">위임하면 — Subagent 경유</text>

  <!-- 메인 (가볍게 유지) -->
  <rect class="card" x="400" y="60" width="120" height="168" rx="8"/>
  <text class="lbl" x="460" y="78" text-anchor="middle">메인 컨텍스트</text>
  <rect class="well" x="414" y="86" width="92" height="130" rx="4"/>
  <rect x="414" y="188" width="92" height="28" rx="4" fill="#5b8a6b" opacity="0.85"/>
  <text class="lbl" x="460" y="232" text-anchor="middle">가볍게 유지됩니다</text>

  <!-- 서브에이전트 -->
  <rect class="card" x="576" y="60" width="144" height="168" rx="8"/>
  <text x="648" y="78" text-anchor="middle" fill="#c08a3e" style="font: 700 10px system-ui, sans-serif;">Subagent</text>
  <rect class="well" x="590" y="86" width="116" height="130" rx="4"/>
  <rect x="590" width="116" rx="4" fill="#7d93b4" class="anim">
    <animate attributeName="height" values="8;56;112;112;8" keyTimes="0;0.35;0.6;0.8;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="208;160;104;104;208" keyTimes="0;0.35;0.6;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect class="static" x="590" y="104" width="116" height="112" rx="4" fill="#7d93b4"/>
  <text class="lbl" x="648" y="232" text-anchor="middle">대량 읽기를 여기서 소화</text>

  <!-- 요약 한 조각이 자식 → 메인 -->
  <path d="M572,150 L528,150" stroke="#5b8a6b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g class="parcel">
    <rect x="586" y="142" width="56" height="17" rx="4" fill="#5b8a6b"/>
    <text x="614" y="154" text-anchor="middle" fill="#ffffff" style="font: 700 9.5px system-ui, sans-serif;">요약</text>
  </g>

  <rect x="400" y="244" width="320" height="36" rx="6" fill="#5b8a6b" opacity="0.13"/>
  <text x="560" y="260" text-anchor="middle" fill="#3f6b4f" style="font: 700 10.5px system-ui, sans-serif;">메인 컨텍스트 보호됨</text>
  <text x="560" y="274" text-anchor="middle" fill="#3f6b4f" style="font: 400 9.5px system-ui, sans-serif;">본 대화는 결정과 방향에만 쓰입니다</text>
</svg>
